name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.6'
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Run credential-free tests
        run: uv run --frozen pytest -q
      - name: Check CLI entry point
        run: uv run --frozen self-heal --help

      - name: Check Python imports and bindings
        run: uv run --frozen ruff check src tests harness evals runner_support --select F

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node --check app.js
      - run: npm test
